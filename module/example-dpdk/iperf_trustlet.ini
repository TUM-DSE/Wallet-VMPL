## F-Stack config for the iperf VNFlet trustlet (module/example-dpdk/iomgr_trustlet.c,
## IPERF_WORKLOAD build). There is no NIC inside the trustlet: __wrap_rte_eal_init
## injects a DPDK net_null port and the rte_eth_rx/tx_burst wraps move packets over
## the iomgr shared rings. So no [vdev]/iface here -- just a plain port_list=0 that
## binds to the injected net_null0.
##
## Reference copy: the trustlet's Gramine manifest only mounts /lib + a tmpfs
## root, so main_iperf() embeds this content as a C string and writes it to
## /config.ini in tmpfs before ff_init(). Keep the two in sync.
[dpdk]
# single lcore (core 0); the monitor pins the trustlet thread itself
lcore_mask=1
channel=4
promiscuous=1
# no NUMA awareness inside the trustlet
numa_on=0
# no hugepages (matches how iomgr_run starts DPDK: --no-huge --iova-mode=pa)
no_huge=1
# net_null has no offloads; keep checksums/TSO off and trust RX csums
tx_csum_offoad_skip=1
tso=0
vlan_strip=0
rx_csum_trust=1
zc_recv=0
zc_send=0
idle_sleep=0
pkt_tx_delay=0
symmetric_rss=0
port_list=0
nb_vdev=0
nb_bond=0

[pcap]
enable=0

# client-side IP; the host runs the F-Stack iperf server on 192.168.31.1
[port0]
addr=192.168.31.2
netmask=255.255.255.0
broadcast=192.168.31.255
gateway=192.168.31.1
lcore_list=0

# fd_reserve MUST equal FF_FD_BASE (128) in native iperf's ff_native.h -- the fd
# offset above which descriptors are treated as F-Stack sockets. Without it the
# native socket calls hit the real (non-socket) fd: "Socket operation on non-socket".
[freebsd.boot]
hz=100
fd_reserve=128
kern.ipc.maxsockets=262144
net.inet.tcp.syncache.hashsize=4096
net.inet.tcp.syncache.bucketlimit=100
net.inet.tcp.tcbhashsize=65536
kern.ncallout=262144
kern.features.inet6=1
