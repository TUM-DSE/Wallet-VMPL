## F-Stack config for the iperf VNFlet trustlet (module/example-dpdk/iomgr_trustlet.c,
## IPERF_WORKLOAD build). There is no NIC inside the trustlet: __wrap_rte_eal_init
## injects a DPDK net_null port and the rte_eth_rx/tx_burst wraps move packets over
## the iomgr shared rings. So no [vdev]/iface here -- just a plain port_list=0 that
## binds to the injected net_null0.
##
## Reference copy: the trustlet's Gramine manifest only mounts /lib + a tmpfs
## root, so main_iperf() embeds this content as a C string and writes it to
## /config.ini in tmpfs before ff_init(). Keep the two in sync.
[dpdk]
# single lcore (core 0); the monitor pins the trustlet thread itself
lcore_mask=1
channel=4
promiscuous=1
# no NUMA awareness inside the trustlet
numa_on=0
# no hugepages (matches how iomgr_run starts DPDK: --no-huge --iova-mode=pa)
no_huge=1
# Offloads on: the trustlet's __wrap_rte_eth_dev_info_get fakes L4-csum + TSO
# capabilities on the net_null port. tx_csum_offoad_skip=0 is REQUIRED for TSO
# (F-Stack's TSO mbuf-flag block is nested inside the tx_csum_l4 guard); with
# tso=1 F-Stack emits ~64KB TSO super-frames and computes no payload checksums
# (the driver's virtio port does the real offloads). rx_csum_trust=1 + faked
# L4-only RX capa = trust inbound checksums (trusted shared-memory transport).
# zc_recv/zc_send enable the native iperf's zero-copy socket paths. Mirrors
# the ~33 Gbit/s vhost_user client config.
tx_csum_offoad_skip=0
tso=1
# 32KB TSO frames fit one mbuf of the driver's TXCOPY_POOL (single-seg ->
# virtio can_push; multi-seg TX is broken: stale hdr_mz IOVA, see iomgr_run.c)
tso_max=32768
vlan_strip=0
rx_csum_trust=1
zc_recv=1
zc_send=1
idle_sleep=0
pkt_tx_delay=0
symmetric_rss=0
port_list=0
nb_vdev=0
nb_bond=0

[pcap]
enable=0

# client-side IP; the host runs the F-Stack iperf server on 192.168.31.1
[port0]
addr=192.168.31.2
netmask=255.255.255.0
broadcast=192.168.31.255
gateway=192.168.31.1
lcore_list=0

# fd_reserve MUST equal FF_FD_BASE (128) in native iperf's ff_native.h -- the fd
# offset above which descriptors are treated as F-Stack sockets. Without it the
# native socket calls hit the real (non-socket) fd: "Socket operation on non-socket".
#
# [freebsd.boot] entries go through kern_setenv (loader tunables); only
# RWTUN/TUNABLE oids read them. Plain sysctls (buffer sizes, delayed_ack,
# cc.algorithm, hpts.*) MUST live in [freebsd.sysctl] or they are silently
# ignored. Mirrors the proven guest client config-vhost-c.ini.
[freebsd.boot]
hz=100
fd_reserve=128
kern.ipc.maxsockets=262144
net.inet.tcp.syncache.hashsize=4096
net.inet.tcp.syncache.bucketlimit=100
net.inet.tcp.tcbhashsize=65536
kern.ncallout=262144
kern.features.inet6=1
[freebsd.sysctl]
kern.ipc.somaxconn=32768
kern.ipc.maxsockbuf=16777216
net.inet.tcp.sendspace=16384
net.inet.tcp.recvspace=8192
net.inet.tcp.cc.algorithm=cubic
# sendbuf cap 2MB (not 16MB): TSO bursts otherwise exhaust the ~1530-mbuf
# shared pool -> ENOBUFS -> cwnd collapse cycle. See iomgr_trustlet.c.
net.inet.tcp.sendbuf_max=2097152
net.inet.tcp.recvbuf_max=16777216
net.inet.tcp.sendbuf_auto=1
net.inet.tcp.recvbuf_auto=1
net.inet.tcp.sendbuf_inc=16384
net.inet.tcp.sack.enable=1
net.inet.tcp.msl=2000
net.inet.tcp.delayed_ack=1
net.inet.tcp.rfc1323=1
net.inet.tcp.functions_default=freebsd
net.inet.tcp.hpts.skip_swi=1
net.inet.tcp.hpts.minsleep=250
net.inet.tcp.hpts.maxsleep=51200
